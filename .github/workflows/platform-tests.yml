name: Platform tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install Gpg4win on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install gpg4win -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $candidates = "${env:ProgramFiles(x86)}\GnuPG\bin", "$env:ProgramFiles\GnuPG\bin"
          $gpg = $candidates | Where-Object { Test-Path (Join-Path $_ 'gpg.exe') } | Select-Object -First 1
          if (-not $gpg) { throw 'Could not find the Gpg4win executable.' }
          $gpg | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install GnuPG if needed on macOS
        if: runner.os == 'macOS'
        run: command -v gpg || brew install gnupg
      - name: Verify Windows launcher first run and restart
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call start-windows.cmd --help || exit /b 1
          call start-windows.cmd --help || exit /b 1
          .venv\Scripts\python.exe -m unittest discover -v
      - name: Verify macOS launcher and Python tests
        if: runner.os == 'macOS'
        run: |
          gpg --version
          bash start.sh --help
          bash start.sh --help
          .venv/bin/python -m unittest discover -v
      - name: Test Nostr locally
        run: npm test
